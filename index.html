<!doctype html>
<html lang="en" data-skin="retro" data-mode="dark" data-palette="classic" data-type="arcade" data-density="cozy" data-decor="standard" data-layout="stacked">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout extend under notches/home indicators;
         the safe-area-inset-* env() values are then consumed in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tints the mobile browser chrome to match the dungeon background. Tracks the
         OS colour scheme; the in-app Light/Dark toggle is data-mode driven and may
         momentarily differ from the OS preference, which is acceptable for chrome. -->
    <meta name="theme-color" content="#06061a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ddd3bb" media="(prefers-color-scheme: light)" />
    <title>one-card-dungeon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply persisted appearance tweaks before first paint to avoid a flash of
         default styling. Key must match STORAGE_KEY in src/state/themeStore.ts. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('ocd:tweaks') || '{}')
        var d = document.documentElement
        ;['skin', 'mode', 'palette', 'type', 'density', 'decor', 'layout'].forEach(function (k) {
          if (t[k]) d.dataset[k] = t[k]
        })
      } catch (e) {
        /* storage blocked — keep the defaults set on <html> */
      }
      // Resolve <html lang> before first paint: a saved choice, else the device
      // language (es/en supported). Key/logic mirror src/i18n/store.ts.
      try {
        var saved = localStorage.getItem('ocd:lang')
        if (saved === 'en' || saved === 'es') {
          document.documentElement.lang = saved
        } else {
          var prefs = navigator.languages || [navigator.language]
          for (var i = 0; i < prefs.length; i++) {
            var p = (prefs[i] || '').toLowerCase()
            if (p.indexOf('es') === 0) {
              document.documentElement.lang = 'es'
              break
            }
            if (p.indexOf('en') === 0) break
          }
        }
      } catch (e) {
        /* storage blocked — keep lang="en" set on <html> */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
